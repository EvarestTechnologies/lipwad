<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lipwad — Capture (mobile)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@400;500;600&amp;family=Schibsted+Grotesk:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7FA6FF}a:hover{color:#B7CBFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #06122A; color: #FFFFFF; font-family: 'Schibsted Grotesk', system-ui, sans-serif; font-size: 15px; line-height: 1.45; display: flex; flex-direction: column; overflow: hidden">

<div style="padding: 18px 16px 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px">
<a href="MobileToday.dc.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 12px; background: #13294B; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
</a>
<span style="display: flex; flex-direction: column; align-items: center; line-height: 1.25">
<span style="font-weight: 700; font-size: 16px">Amina Wanjiru</span>
<span style="font-size: 12px; color: #A9B8D6">General ward · Bed 4</span>
</span>
<span style="font-family: 'Martian Mono', monospace; font-size: 11px; background: #13294B; color: #C3CEE4; padding: 6px 8px; border-radius: 8px">3 / 3</span>
</div>

<div style="flex-grow: 1; margin: 6px 16px; border-radius: 20px; background: #1A2638; position: relative; overflow: hidden">
<div style="position: absolute; top: 15%; left: 16%; width: 64%; height: 62%; background: #F3EFE4; transform: rotate(-5deg); border-radius: 2px; box-shadow: 0 16px 30px rgba(0,0,0,0.5); font-family: 'Martian Mono', monospace; color: #4A5163; padding: 16px 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 9px">
<span style="font-size: 9px; font-weight: 600; letter-spacing: 0.1em; border-bottom: 1px solid #CFCBBF; padding-bottom: 5px">INVOICE · ITEMISED</span>
<span style="height: 4px; width: 80%; background: #D9D5CA; border-radius: 2px"></span>
<span style="height: 4px; width: 92%; background: #E2DED4; border-radius: 2px"></span>
<span style="height: 4px; width: 70%; background: #E2DED4; border-radius: 2px"></span>
<span style="height: 4px; width: 86%; background: #E2DED4; border-radius: 2px"></span>
<span style="height: 4px; width: 60%; background: #E2DED4; border-radius: 2px"></span>
<span style="height: 4px; width: 88%; background: #E2DED4; border-radius: 2px"></span>
<span style="margin-top: auto; font-size: 9px; text-align: right">TOTAL · KSh 48,500</span>
</div>
<div style="position: absolute; top: 13.5%; left: 14.5%; width: 67%; height: 65%; transform: rotate(-5deg); border: 2px solid #7FA6FF; border-radius: 4px; background: rgba(127,166,255,0.10)" aria-hidden="true"></div>
<div style="position: absolute; left: 14px; right: 14px; bottom: 14px; display: flex; align-items: center; gap: 10px; background: rgba(6,18,42,0.88); border-radius: 12px; padding: 10px 12px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6FE0B8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>
<span style="display: flex; flex-direction: column; line-height: 1.3">
<span style="font-size: 14px; font-weight: 600">Itemised invoice found</span>
<span style="font-size: 12px; color: #A9B8D6">Edges locked by SAM 3.1 · hold steady</span>
</span>
</div>
</div>

<div style="padding: 10px 16px 0; display: flex; gap: 8px" aria-label="Captured documents">
<span style="flex: 1 1 0; font-size: 11px; padding: 8px 6px; border-radius: 10px; background: #13294B; color: #C3CEE4; text-align: center">Discharge</span>
<span style="flex: 1 1 0; font-size: 11px; padding: 8px 6px; border-radius: 10px; background: #13294B; color: #C3CEE4; text-align: center">Consent</span>
<span style="flex: 1 1 0; font-size: 11px; padding: 8px 6px; border-radius: 10px; background: #13294B; color: #C3CEE4; text-align: center">Lab slip</span>
<span style="flex: 1 1 0; font-size: 11px; padding: 8px 6px; border-radius: 10px; background: #2B4B85; color: #FFFFFF; font-weight: 600; text-align: center">Invoice</span>
</div>

<div style="padding: 16px 24px 8px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: center">
<button type="button" onClick="{{toggle}}" aria-label="{{recLabel}}" aria-pressed="{{recPressed}}" style="{{voiceStyle}}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg>
</button>
<button type="button" aria-label="Take photo" style="justify-self: center; width: 76px; height: 76px; border-radius: 50%; border: 4px solid #FFFFFF; background: transparent; padding: 5px; cursor: pointer"><span style="display: block; width: 100%; height: 100%; border-radius: 50%; background: #FFFFFF"></span></button>
<span style="justify-self: end; font-family: 'Martian Mono', monospace; font-size: 12px; color: {{timeColor}}">{{voiceTime}}</span>
</div>
<span style="text-align: center; font-size: 13px; color: #C3CEE4; padding: 0 24px">{{voiceHint}}</span>

<div style="padding: 14px 16px 26px">
<a href="MobileReview.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 54px; border-radius: 14px; background: #7FA6FF; color: #06122A; font-weight: 800; font-size: 16px; text-decoration: none">Build claim</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { rec: false };
  }
  renderVals() {
    var self = this;
    var rec = this.state.rec;
    return {
      toggle: function () { self.setState({ rec: !self.state.rec }); },
      recLabel: rec ? 'Stop voice note' : 'Record voice note',
      recPressed: rec ? 'true' : 'false',
      voiceStyle: 'justify-self: start; width: 52px; height: 52px; border-radius: 16px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; ' + (rec ? 'background: #E0483D; color: #FFFFFF' : 'background: #13294B; color: #FFFFFF'),
      voiceTime: rec ? '● 0:09' : '0:42 saved',
      timeColor: rec ? '#FF9A90' : '#A9B8D6',
      voiceHint: rec ? 'Listening… English, Kiswahili or Sheng.' : 'Voice note saved. Tap the mic to add more.'
    };
  }
}
</script>
</body>
</html>
