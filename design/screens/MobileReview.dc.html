<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lipwad — Claim review (mobile)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@400;500;600&amp;family=Schibsted+Grotesk:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1C3F80}a:hover{color:#0A1F44}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F3EE; color: #0A1F44; font-family: 'Schibsted Grotesk', system-ui, sans-serif; font-size: 15px; line-height: 1.45; display: flex; flex-direction: column; overflow: hidden">

<div style="padding: 18px 16px 14px; display: flex; flex-direction: column; gap: 10px; background: #FFFFFF; border-bottom: 1px solid #E2DED4">
<div style="display: flex; align-items: center; gap: 8px">
<a href="MobileToday.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: flex-start; color: #0A1F44">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
</a>
<span style="display: flex; flex-direction: column; line-height: 1.25; flex-grow: 1">
<span style="font-weight: 800; font-size: 19px; letter-spacing: -0.02em">Amina Wanjiru</span>
<span style="font-size: 12px; color: #4D5A73">Inpatient · 3 nights · <span style="font-family: 'Martian Mono', monospace">KSh 48,500</span></span>
</span>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; background: #FFF7E3; border-radius: 12px; padding: 10px 12px">
<span style="display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; color: #8A4B00"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 3l9.5 17h-19z"/><path d="M12 10v4M12 17v.01"/></svg>1 fix: itemised invoice</span>
<span style="font-size: 12px; font-weight: 700; color: #8A4B00">4 days left</span>
</div>
</div>

<div style="flex-grow: 1; overflow: hidden; padding: 6px 0 0">
<sc-for list="{{fields}}" as="fd" hint-placeholder-count="6">
<button type="button" onClick="{{fd.pick}}" aria-pressed="{{fd.pressed}}" style="{{fd.rowStyle}}">
<span style="display: flex; flex-direction: column; min-width: 0; flex-grow: 1; text-align: left; line-height: 1.3">
<span style="font-size: 12px; color: #4D5A73">{{fd.label}}</span>
<span style="{{fd.valueStyle}}">{{fd.value}}</span>
</span>
<span style="{{fd.chipStyle}}">{{fd.chip}}</span>
</button>
</sc-for>
</div>

<div style="background: #06122A; color: #FFFFFF; border-radius: 22px 22px 0 0; padding: 10px 16px 24px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 -10px 30px rgba(6,18,42,0.25)">
<span style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: #2C4673" aria-hidden="true"></span>
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px">
<span style="font-weight: 700; font-size: 15px">Proof · {{sel.label}}</span>
<span style="font-family: 'Martian Mono', monospace; font-size: 10px; color: #A9B8D6">{{sel.ref}}</span>
</div>
<sc-if value="{{sel.isImage}}" hint-placeholder-val="{{false}}">
<div style="background: #FBF9F3; color: #3A4256; border-radius: 10px; padding: 14px; font-family: 'Martian Mono', monospace; font-size: 11px; display: flex; flex-direction: column; gap: 8px">
<span style="color: #4D5A73">Discharge summary · photo 1</span>
<span style="align-self: flex-start; background: rgba(127,166,255,0.32); border: 2px solid #3D6FE0; border-radius: 4px; padding: 4px 8px; color: #0A1F44">{{sel.quote}}</span>
</div>
</sc-if>
<sc-if value="{{sel.isAudio}}" hint-placeholder-val="{{true}}">
<div style="background: #0D1E3D; border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 10px">
<button type="button" aria-label="Play this part" style="width: 44px; height: 44px; border-radius: 50%; border: none; background: #7FA6FF; color: #06122A; display: flex; align-items: center; justify-content: center; flex-shrink: 0; cursor: pointer"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></button>
<div style="display: flex; align-items: center; gap: 2px; height: 34px; flex-grow: 1" aria-hidden="true">
<sc-for list="{{bars}}" as="b" hint-placeholder-count="30"><span style="{{b.style}}"></span></sc-for>
</div>
</div>
<span style="font-size: 14px; line-height: 1.5">{{sel.quote}}</span>
</div>
</sc-if>
<sc-if value="{{sel.isRule}}" hint-placeholder-val="{{false}}">
<div style="background: #FBF9F3; color: #0A1F44; border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px">
<span style="align-self: flex-start; font-family: 'Martian Mono', monospace; font-size: 10px; background: #0A1F44; color: #FFFFFF; padding: 3px 7px; border-radius: 5px">{{sel.ref}}</span>
<span style="font-size: 14px">{{sel.quote}}</span>
</div>
</sc-if>
<a href="MobileCapture.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; border-radius: 14px; background: #7FA6FF; color: #06122A; font-weight: 800; font-size: 15px; text-decoration: none">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
Snap itemised invoice
</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: 'stay' };
  }
  renderVals() {
    var defs = [
      { id: 'admit', label: 'Admitted', value: '09 Oct 2026', kind: 'image', chip: 'Photo', ref: 'IMG-0412-1 · r2', quote: 'Admitted: 09/10/2026' },
      { id: 'discharge', label: 'Discharged', value: '12 Oct 2026', kind: 'image', chip: 'Photo', ref: 'IMG-0412-1 · r3', quote: 'Discharged: 12/10/2026' },
      { id: 'dx', label: 'Diagnosis, coded', value: 'Lobar pneumonia', kind: 'image', chip: 'Photo', ref: 'IMG-0412-1 · r4', quote: 'Diagnosis: Lobar pneumonia' },
      { id: 'stay', label: 'Length of stay', value: '3 nights, general ward', kind: 'audio', chip: 'Voice', ref: 'AUD-0412-1 · 0:12', quote: '“Alilazwa siku tatu, general ward, bed four…”' },
      { id: 'clin', label: 'Clinician', value: 'Dr. A. Otieno · in registry', kind: 'image', chip: 'Photo', ref: 'IMG-0412-1 · r5', quote: 'Clinician: Dr. A. Otieno' },
      { id: 'invoice', label: 'Itemised invoice', value: 'Missing', kind: 'rule', chip: 'Needed', ref: 'SHA-CIR-01 · v[YYYY-MM]', quote: '[Inpatient claims need an itemised invoice listing each service, quantity and amount.]', missing: true }
    ];
    var self = this;
    var sel = this.state.sel;
    var fields = defs.map(function (d) {
      var on = d.id === sel;
      return {
        label: d.label, value: d.value, chip: d.chip,
        pressed: on ? 'true' : 'false',
        pick: function () { self.setState({ sel: d.id }); },
        rowStyle: 'font: inherit; color: inherit; display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 16px; min-height: 54px; border: none; border-bottom: 1px solid #EEEAE1; cursor: pointer; background: ' + (on ? '#EEF1F7' : 'transparent') + ';' + (on ? ' outline: 2px solid #7FA6FF; outline-offset: -2px;' : ''),
        valueStyle: d.missing ? 'font-size: 15px; font-weight: 700; color: #8A4B00' : 'font-size: 15px; font-weight: 600',
        chipStyle: 'flex-shrink: 0; font-family: \'Martian Mono\', monospace; font-size: 10px; padding: 4px 7px; border-radius: 6px; ' + (d.missing ? 'background: #FFEFCC; color: #8A4B00' : (d.kind === 'audio' ? 'background: #E1EAFB; color: #1C4FA8' : 'background: #EEF1F7; color: #23417A'))
      };
    });
    var s = defs.filter(function (d) { return d.id === sel; })[0];
    var heights = [30, 52, 40, 68, 44, 24, 58, 80, 36, 62, 74, 50, 66, 42, 28, 54, 70, 46, 32, 60, 76, 40, 26, 56, 64, 38, 48, 72, 34, 58];
    var bars = heights.map(function (h, i) {
      var hot = i >= 8 && i <= 14;
      return { style: 'display: block; flex: 1 1 0; min-width: 2px; border-radius: 2px; height: ' + h + '%; background: ' + (hot ? '#7FA6FF' : '#2C4673') };
    });
    return {
      fields: fields, bars: bars,
      sel: { label: s.label, ref: s.ref, quote: s.quote, isImage: s.kind === 'image', isAudio: s.kind === 'audio', isRule: s.kind === 'rule' }
    };
  }
}
</script>
</body>
</html>
