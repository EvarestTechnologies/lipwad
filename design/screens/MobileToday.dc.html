<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lipwad — Today (mobile)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@400;500;600&amp;family=Schibsted+Grotesk:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1C3F80}a:hover{color:#0A1F44}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F3EE; color: #0A1F44; font-family: 'Schibsted Grotesk', system-ui, sans-serif; font-size: 15px; line-height: 1.45; display: flex; flex-direction: column; overflow: hidden">

<div style="background: #06122A; color: #FFFFFF; padding: 22px 20px 22px; display: flex; flex-direction: column; gap: 16px; border-radius: 0 0 24px 24px">
<div style="display: flex; align-items: center; justify-content: space-between">
<span style="display: flex; align-items: center; gap: 8px">
<svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#7FA6FF"/><path d="M11 8v15h11" fill="none" stroke="#06122A" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M15.5 15.5l2.5 2.5 5-6" fill="none" stroke="#06122A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
<span style="font-weight: 800; font-size: 19px; letter-spacing: -0.035em">lipwad</span>
</span>
<span style="font-size: 12px; color: #A9B8D6">Mwangaza HC · L4</span>
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 13px; color: #A9B8D6">At risk if not fixed today</span>
<span style="font-family: 'Martian Mono', monospace; font-size: 30px; font-weight: 600; letter-spacing: -0.04em; color: {{riskColor}}">{{atRiskLabel}}</span>
<span style="font-size: 14px; color: #C3CEE4">{{headline}}</span>
</div>
</div>

<div style="flex-grow: 1; overflow: hidden; padding: 18px 16px 12px; display: flex; flex-direction: column; gap: 10px">
<h1 style="margin: 0 4px; font-size: 17px; font-weight: 700">Needs you</h1>
<sc-for list="{{tasks}}" as="t" hint-placeholder-count="3">
<article style="{{t.cardStyle}}">
<sc-if value="{{t.open}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
<span style="{{t.pillStyle}}">{{t.pillLabel}}</span>
<span style="{{t.deadlineStyle}}">{{t.deadline}}</span>
</div>
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px">
<span style="font-weight: 700; font-size: 16px">{{t.patient}}</span>
<span style="font-family: 'Martian Mono', monospace; font-size: 13px">{{t.amountLabel}}</span>
</div>
<p style="margin: 0; font-size: 14px; color: #1E2C47">{{t.reason}}</p>
<button type="button" onClick="{{t.pick}}" style="font: inherit; font-weight: 700; font-size: 15px; min-height: 46px; border-radius: 12px; border: none; background: #0A1F44; color: #FFFFFF; cursor: pointer">{{t.action}}</button>
</div>
</sc-if>
<sc-if value="{{t.done}}" hint-placeholder-val="{{false}}">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
<span style="display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; color: #0B6B4F"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></svg>{{t.patient}} · done</span>
<button type="button" onClick="{{t.pick}}" style="font: inherit; font-size: 13px; font-weight: 600; min-height: 44px; padding: 0 10px; border: none; background: transparent; color: #1C3F80; cursor: pointer">Undo</button>
</div>
</sc-if>
</article>
</sc-for>
<div style="margin-top: 4px; display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: #FFFFFF; border: 1px solid #E2DED4; border-radius: 14px">
<span style="width: 9px; height: 9px; border-radius: 50%; background: #12A27A; box-shadow: 0 0 0 4px #DDF2E8; flex-shrink: 0" aria-hidden="true"></span>
<span style="font-size: 13px; color: #1E2C47">Lipwad attached a lab slip and sent 1 claim to SHA this morning.</span>
</div>
</div>

<nav aria-label="Main" style="background: #FFFFFF; border-top: 1px solid #E2DED4; padding: 6px 8px 22px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: end">
<a href="MobileToday.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 52px; justify-content: center; text-decoration: none; color: #0A1F44; font-size: 11px; font-weight: 700">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 13h5l1.5 3h5L16 13h5"/><path d="M5.5 5h13L21 13v6H3v-6z"/></svg>
Today
</a>
<a href="MobileReview.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 52px; justify-content: center; text-decoration: none; color: #4D5A73; font-size: 11px; font-weight: 500">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h8l4 4v14H7z"/><path d="M15 3v4h4M10 12h6M10 16h4"/></svg>
Claims
</a>
<a href="MobileCapture.dc.html" aria-label="New claim" style="display: flex; justify-content: center; text-decoration: none">
<span style="width: 60px; height: 60px; margin-top: -26px; border-radius: 20px; background: #0A1F44; color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 20px rgba(10,31,68,0.35)">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
</span>
</a>
<a href="MobileToday.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 52px; justify-content: center; text-decoration: none; color: #4D5A73; font-size: 11px; font-weight: 500">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg>
Money
</a>
<a href="MobileToday.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 52px; justify-content: center; text-decoration: none; color: #4D5A73; font-size: 11px; font-weight: 500">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 016.5 3H20v15H6.5A2.5 2.5 0 004 20.5z"/><path d="M4 20.5A2.5 2.5 0 016.5 18H20v3H6.5"/></svg>
Rules
</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { done: {} };
  }
  renderVals() {
    var self = this;
    var done = this.state.done;
    var defs = [
      { id: 'a', crit: true, pill: 'Returned by SHA', patient: 'Lucy Chebet', amount: 27300, reason: 'Lab result wasn’t attached. Lipwad found it and drafted the fix.', deadline: '1 day left', action: 'Approve fix' },
      { id: 'b', crit: true, pill: 'Blocked', patient: 'Hassan Abdi', amount: 64000, reason: 'Doctor’s ID isn’t in the Health Worker Registry.', deadline: '1 day left', action: 'Fix ID' },
      { id: 'c', crit: false, pill: 'Needs a fix', patient: 'Peter Mutua', amount: 36300, reason: 'Discharge summary unsigned on page 2.', deadline: '2 days left', action: 'Snap signed page' }
    ];
    var risk = 0, open = 0;
    var tasks = defs.map(function (d) {
      var isDone = !!done[d.id];
      if (!isDone) { risk += d.amount; open += 1; }
      return {
        patient: d.patient, reason: d.reason, deadline: d.deadline, action: d.action, pillLabel: d.pill,
        amountLabel: 'KSh ' + d.amount.toLocaleString('en-US'),
        open: !isDone, done: isDone,
        pick: function () { var n = Object.assign({}, self.state.done); n[d.id] = !n[d.id]; self.setState({ done: n }); },
        cardStyle: 'background: #FFFFFF; border: 1px solid ' + (isDone ? '#BFE5D3' : '#E2DED4') + '; border-radius: 16px; padding: ' + (isDone ? '4px 14px' : '14px'),
        pillStyle: 'font-weight: 700; font-size: 11px; padding: 3px 9px; border-radius: 999px; ' + (d.crit ? 'background: #FCE1DE; color: #A3201B' : 'background: #FFEFCC; color: #8A4B00'),
        deadlineStyle: 'font-size: 12px; font-weight: 700; ' + (d.crit ? 'color: #A3201B' : 'color: #8A4B00')
      };
    });
    return {
      tasks: tasks,
      atRiskLabel: 'KSh ' + risk.toLocaleString('en-US'),
      riskColor: risk === 0 ? '#6FE0B8' : '#FFFFFF',
      headline: open === 0 ? 'You’re clear. Lipwad is watching the rest.' : open + (open === 1 ? ' claim needs' : ' claims need') + ' you. The rest is moving.'
    };
  }
}
</script>
</body>
</html>
